<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>
    Create Your ID | Hacker House Goa 2026
  </title>


  <!-- Tailwind -->

  <script src="https://cdn.tailwindcss.com"></script>


  <!-- Tailwind configuration -->

  <script>

    tailwind.config = {

      theme: {

        extend: {

          colors: {

            green: '#064D2D',

            darkGreen: '#03351F',

            pink: '#E9005B',

            yellow: '#FFD900'

          }

        }

      }

    }

  </script>


  <!-- Fonts -->

  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Bricolage+Grotesque:opsz,wght@12..96,400;600;700;800&display=swap"
    rel="stylesheet">


  <!-- Your CSS -->

  <link rel="stylesheet" href="styles.css">

</head>


<body class="generator-page">


  <!-- =====================================================
         NAVIGATION
    ====================================================== -->

  <nav class="site-nav">

    <div class="nav-logo">
      HACKER HOUSE
    </div>

    <div class="nav-links">

      <a href="index.html">
        HOME
      </a>

      <a href="generator.html">
        GENERATOR
      </a>

    </div>

  </nav>


  <!-- =====================================================
         GENERATOR
    ====================================================== -->

  <main class="generator-wrapper">


    <!-- =================================================
             LEFT SIDE - FORM
        ================================================== -->

    <section class="generator-form">

      <div class="section-heading">

        <p class="eyebrow">
          2:47 PM STUDIO
        </p>

        <h1>
          CREATE YOUR ID
        </h1>

        <p>
          Upload your photo and enter your details.
        </p>

      </div>


      <!-- =================================================
                 PHOTO UPLOAD
            ================================================== -->

      <div class="form-group">

        <label>
          PHOTO
        </label>


        <div id="upload-area" class="upload-box">

          <span class="upload-icon">
            +
          </span>

          <span>
            CLICK OR DRAG PHOTO HERE
          </span>

          <small>
            PNG / JPG / JPEG
          </small>

        </div>


        <input type="file" id="file-input" accept="image/png,image/jpeg,image/jpg" hidden>

      </div>


      <!-- =================================================
                 NAME
            ================================================== -->

      <div class="form-group">

        <label for="name-input">
          NAME
        </label>

        <input id="name-input" type="text" placeholder="Enter your name" autocomplete="off">

      </div>


      <!-- =================================================
                 GITHUB
            ================================================== -->

      <div class="form-group">

        <label for="github-input">
          GITHUB
        </label>

        <input id="github-input" type="text" placeholder="@github_username" autocomplete="off">

      </div>


      <!-- =================================================
                 ROLE
            ================================================== -->

      <div class="form-group">

        <label for="role-select">
          ROLE
        </label>

        <select id="role-select">

          <option value="AI ENGINEER">
            AI ENGINEER
          </option>

          <option value="BUILDER">
            BUILDER
          </option>

          <option value="DESIGNER">
            DESIGNER
          </option>

          <option value="SPEAKER">
            SPEAKER
          </option>

          <option value="DEVELOPER">
            DEVELOPER
          </option>

          <option value="HACKER">
            HACKER
          </option>

        </select>

      </div>


      <!-- =================================================
                 THEME
            ================================================== -->

      <input type="hidden" id="theme-select" value="dark">


      <!-- =================================================
                 GENERATE
            ================================================== -->

      <button id="generate-btn" class="generate-button" type="button">

        GENERATE ID

      </button>

    </section>



    <!-- =====================================================
             RIGHT SIDE - PREVIEW
        ====================================================== -->

    <section class="preview-section">

      <div class="preview-heading">

        <span>
          LIVE PREVIEW
        </span>

        <span class="preview-dot">
          ●
        </span>

      </div>


      <div id="preview-container" class="badge-preview">

        <img id="preview-image" alt="Hacker House Goa 2026 ID preview">

      </div>


      <button id="download-btn" class="download-button" type="button" disabled>

        DOWNLOAD ID

      </button>

    </section>

  </main>


  <!-- =====================================================
         HIDDEN SVG USED FOR BARCODE GENERATION
    ====================================================== -->

  <svg id="barcode" style="display:none;"></svg>


  <!-- =====================================================
         JsBarcode
    ====================================================== -->

  <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js">
  </script>


  <!-- =====================================================
         MAIN JS
    ====================================================== -->

  <script src="script.js"></script>


</body>

</html>
