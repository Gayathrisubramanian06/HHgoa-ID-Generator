<script>
(function() {
  const btn = document.getElementById('generate-btn');
  const nameInput = document.getElementById('name');
  const roleInput = document.getElementById('role');
  const photoInput = document.getElementById('photo-upload');
  const previewContainer = document.getElementById('upload-preview-container');
  const originalContent = previewContainer.innerHTML;

  const REMOVE_BG_API_KEY = "2WmGDqurYTJo64YoEfVPEW6D";

  let uploadedImgDataUrl = null;
  let bgRemovalDone = false;

  function showNotification(message) {
    const existing = document.getElementById('validation-alert');
    if (existing) existing.remove();

    const alert = document.createElement('div');
    alert.id = 'validation-alert';
    alert.className = 'fixed top-24 left-1/2 -translate-x-1/2 z-[100] px-6 py-4 bg-secondary text-on-secondary border-2 border-surface-container-lowest neo-shadow-lg font-bold uppercase tracking-wider flex items-center gap-4 animate-bounce';
    alert.innerHTML = `
      <span class="material-symbols-outlined">warning</span>
      <span>${message}</span>
      <button onclick="this.parentElement.remove()" class="ml-4 hover:scale-110 transition-transform">
        <span class="material-symbols-outlined">close</span>
      </button>
    `;
    document.body.appendChild(alert);
    setTimeout(() => alert.remove(), 5000);
  }

  photoInput.addEventListener('change', async function(e) {
    const file = e.target.files[0];
    if (!file) {
      uploadedImgDataUrl = null;
      bgRemovalDone = false;
      previewContainer.innerHTML = originalContent;
      return;
    }

    const fileSize = (file.size / 1024).toFixed(1) + ' KB';
    uploadedImgDataUrl = null;
    bgRemovalDone = false;

    previewContainer.innerHTML = `
      <div class="flex flex-col items-center gap-4 w-full">
        <div class="w-24 h-24 rounded-full border-2 border-surface-container-lowest neo-shadow-lg flex items-center justify-center bg-tertiary-container relative overflow-hidden">
          <span class="material-symbols-outlined text-4xl text-on-tertiary-container animate-[spin_2s_linear_infinite]">sync</span>
        </div>
        <div class="flex flex-col items-center gap-1 text-center">
          <span class="text-on-background font-bold uppercase tracking-wider text-sm">> REMOVING_BACKGROUND_API...</span>
          <p class="text-on-surface-variant text-xs font-mono">${file.name} (${fileSize})</p>
        </div>
      </div>
    `;

    try {
      const formData = new FormData();
      formData.append('image_file', file);
      formData.append('size', 'auto');

      const response = await fetch('https://api.remove.bg/v1.0/removebg', {
        method: 'POST',
        headers: {
          'X-Api-Key': REMOVE_BG_API_KEY
        },
        body: formData
      });

      if (!response.ok) {
        throw new Error(`API Error: ${response.status}`);
      }

      const resultBlob = await response.blob();
      const reader = new FileReader();
      reader.onload = function(ev) {
        uploadedImgDataUrl = ev.target.result;
        bgRemovalDone = true;

        previewContainer.innerHTML = `
          <div class="flex flex-col items-center gap-4 w-full">
            <div class="w-32 h-32 rounded-full border-2 border-surface-container-lowest neo-shadow-lg bg-surface-container relative overflow-hidden">
              <img src="${uploadedImgDataUrl}" class="w-full h-full object-cover" />
            </div>
            <div class="flex flex-col items-center gap-1 text-center">
              <span class="text-primary font-bold uppercase tracking-wider text-sm">> SUBJECT_ACQUIRED</span>
              <p class="text-on-surface-variant text-xs font-mono">${file.name}</p>
            </div>
            <button type="button" onclick="location.reload()" class="text-secondary text-xs uppercase font-bold hover:underline">> RESET</button>
          </div>
        `;
      };
      reader.readAsDataURL(resultBlob);
    } catch (err) {
      console.error('Background removal failed:', err);
      const fallbackReader = new FileReader();
      fallbackReader.onload = function(ev) {
        uploadedImgDataUrl = ev.target.result;
        bgRemovalDone = true;
        previewContainer.innerHTML = `
          <div class="flex flex-col items-center gap-4 w-full">
            <div class="w-32 h-32 rounded-full border-2 border-surface-container-lowest neo-shadow-lg overflow-hidden">
              <img src="${uploadedImgDataUrl}" class="w-full h-full object-cover" />
            </div>
            <div class="flex flex-col items-center gap-1 text-center">
              <span class="text-secondary font-bold uppercase tracking-wider text-sm">> RAW_IMAGE_LOADED (API_FAILED)</span>
              <p class="text-on-surface-variant text-xs font-mono">${err.message}</p>
            </div>
            <button type="button" onclick="location.reload()" class="text-primary text-xs uppercase font-bold hover:underline">> RESET</button>
          </div>
        `;
      };
      fallbackReader.readAsDataURL(file);
    }
  });

  btn.addEventListener('click', () => {
    const missing = [];
    if (!nameInput.value.trim()) missing.push('NAME');
    if (!roleInput.value.trim()) missing.push('ROLE');
    if (!uploadedImgDataUrl && !bgRemovalDone) missing.push('PHOTO');

    if (missing.length > 0) {
      showNotification(`ERR: MISSING [ ${missing.join(', ')} ]`);
      return;
    }

    if (!bgRemovalDone) {
      showNotification('PROCESSING_IMAGE... PLEASE_WAIT');
      return;
    }

    btn.textContent = '[ GENERATING... ]';
    btn.disabled = true;
    
    // Ensure fonts are loaded before drawing on canvas
    document.fonts.ready.then(() => {
      generateBadgeAndRedirect();
    });
  });

  function generateBadgeAndRedirect() {
    const W = 800, H = 1100;
    const canvas = document.createElement('canvas');
    canvas.width = W; canvas.height = H;
    const ctx = canvas.getContext('2d');
    
    // Design.md palette
    const jungleDark = '#064E3B';       // jungle-dark
    const primaryContainer = '#22c55e'; // primary-container
    const secondaryContainer = '#fd56a7'; // secondary-container
    const secondary = '#b4136d';        // secondary
    const onSurface = '#131b2e';        // on-surface
    const surfaceBright = '#faf8ff';    // surface-bright
    const onPrimary = '#ffffff';        // on-primary

    // 1. DARK GREEN BACKGROUND
    const grad = ctx.createRadialGradient(W/2, H*0.25, 60, W/2, H*0.5, H*0.9);
    grad.addColorStop(0, '#059669');
    grad.addColorStop(0.4, '#064E3B');
    grad.addColorStop(1, '#022c22');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, W, H);

    // 2. SUBTLE CIRCUIT-BOARD TRACES (organic tech lines, NOT a grid)
    ctx.strokeStyle = 'rgba(34,197,94,0.12)';
    ctx.lineWidth = 1.5;
    // Horizontal traces
    const traceYs = [60, 145, 280, 400, 550, 680, 800, 920, 1020];
    traceYs.forEach(ty => {
      ctx.beginPath();
      let x = Math.random() * 100;
      ctx.moveTo(x, ty);
      while (x < W) {
        const segLen = 30 + Math.random() * 80;
        x += segLen;
        ctx.lineTo(Math.min(x, W), ty);
        if (Math.random() > 0.6) {
          const turn = (Math.random() > 0.5 ? 1 : -1) * (20 + Math.random() * 40);
          ctx.lineTo(Math.min(x + 10, W), ty + turn);
          ctx.moveTo(Math.min(x + 10, W), ty);
        }
      }
      ctx.stroke();
    });
    // Vertical traces
    const traceXs = [80, 200, 350, 500, 620, 720];
    traceXs.forEach(tx => {
      ctx.beginPath();
      let y = Math.random() * 100;
      ctx.moveTo(tx, y);
      while (y < H) {
        const segLen = 40 + Math.random() * 80;
        y += segLen;
        ctx.lineTo(tx, Math.min(y, H));
        if (Math.random() > 0.6) {
          const turn = (Math.random() > 0.5 ? 1 : -1) * (15 + Math.random() * 30);
          ctx.lineTo(tx + turn, Math.min(y + 10, H));
          ctx.moveTo(tx, Math.min(y + 10, H));
        }
      }
      ctx.stroke();
    });
    // Small circuit dots at intersections
    ctx.fillStyle = 'rgba(34,197,94,0.15)';
    for (let i = 0; i < 20; i++) {
      const dx = 60 + Math.random() * (W - 120);
      const dy = 60 + Math.random() * (H - 120);
      ctx.beginPath(); ctx.arc(dx, dy, 3, 0, Math.PI * 2); ctx.fill();
    }

    // 3. ROUNDED CARD BORDER (subtle green outline)
    ctx.strokeStyle = 'rgba(34,197,94,0.3)';
    ctx.lineWidth = 2.5;
    const pad = 20, cr = 28;
    ctx.beginPath();
    ctx.moveTo(pad + cr, pad);
    ctx.lineTo(W - pad - cr, pad);
    ctx.quadraticCurveTo(W - pad, pad, W - pad, pad + cr);
    ctx.lineTo(W - pad, H - pad - cr);
    ctx.quadraticCurveTo(W - pad, H - pad, W - pad - cr, H - pad);
    ctx.lineTo(pad + cr, H - pad);
    ctx.quadraticCurveTo(pad, H - pad, pad, H - pad - cr);
    ctx.lineTo(pad, pad + cr);
    ctx.quadraticCurveTo(pad, pad, pad + cr, pad);
    ctx.closePath();
    ctx.stroke();

    const nameVal = nameInput.value.trim().toUpperCase();
    const roleVal = roleInput.value.trim().toUpperCase();

    // 4. PHOTO (large, centered, bottom-aligned)
    const userImg = new Image();
    userImg.onload = function() {
      const imgAspect = userImg.width / userImg.height;
      let drawH = H * 0.75;
      let drawW = drawH * imgAspect;
      if (drawW > W * 0.95) {
        drawW = W * 0.95;
        drawH = drawW / imgAspect;
      }
      const imgX = (W - drawW) / 2;
      const imgY = H - drawH + 10;
      ctx.drawImage(userImg, imgX, imgY, drawW, drawH);

      // 5. HEADER: "HACKER HOUSE GOA 2026" with 3D extrusion
      ctx.textAlign = 'center';
      ctx.font = '800 72px "Bricolage Grotesque"';
      
      // 3D shadow layers (offset to bottom-right)
      for (let i = 8; i >= 1; i--) {
        ctx.fillStyle = '#022c22';
        ctx.fillText('HACKER HOUSE', W/2 + i * 0.9, 110 + i * 0.9);
        ctx.fillText('GOA 2026', W/2 + i * 0.9, 190 + i * 0.9);
      }
      // Main white text
      ctx.fillStyle = onPrimary;
      ctx.fillText('HACKER HOUSE', W/2, 110);
      ctx.fillText('GOA 2026', W/2, 190);

      // 6. NAME & ROLE (left-aligned)
      ctx.textAlign = 'left';
      
      // Name in pink
      ctx.font = '800 40px "Bricolage Grotesque"';
      ctx.fillStyle = 'rgba(0,0,0,0.4)';
      ctx.fillText(nameVal, 52, 370);
      ctx.fillStyle = secondaryContainer;
      ctx.fillText(nameVal, 50, 368);
      
      // Role in white italic
      ctx.font = 'italic 400 24px "JetBrains Mono"';
      ctx.fillStyle = 'rgba(0,0,0,0.3)';
      ctx.fillText(roleVal, 52, 404);
      ctx.fillStyle = '#e2e8f0';
      ctx.fillText(roleVal, 50, 402);

      // 7. DIAGONAL RIBBONS (two pink sashes)
      const ribbonText = (nameVal + ' • ' + roleVal + ' • ').repeat(8);
      
      function drawRibbon(yCenter, angle) {
        ctx.save();
        ctx.translate(W / 2, yCenter);
        ctx.rotate(angle * Math.PI / 180);
        
        // Ribbon bg
        ctx.fillStyle = secondaryContainer;
        ctx.fillRect(-W * 2, -30, W * 4, 60);
        
        // Ribbon text
        ctx.fillStyle = onPrimary;
        ctx.font = '800 24px "Bricolage Grotesque"';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(ribbonText, 0, 0);
        
        ctx.restore();
      }

      // First ribbon: across belly/waist area of the photo
      drawRibbon(H * 0.68, -10);
      
      // Second ribbon: near the bottom
      drawRibbon(H * 0.88, -10);

      // SAVE & REDIRECT
      try {
        sessionStorage.setItem('generatedBadge', canvas.toDataURL('image/png'));
        sessionStorage.setItem('generatedBadgeName', nameInput.value.trim());
        window.location.href = 'success.html';
      } catch (e) {
        console.error(e);
        btn.textContent = 'GENERATE';
        btn.disabled = false;
        alert('ERR: IMAGE_TOO_LARGE');
      }
    };
    userImg.src = uploadedImgDataUrl;
  }
})();
</script></body></html>
