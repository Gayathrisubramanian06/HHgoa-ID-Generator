<script type="module">
(function() {
  const btn = document.getElementById('generate-btn');
  const nameInput = document.getElementById('name');
  const roleInput = document.getElementById('role');
  const photoInput = document.getElementById('photo-upload');
  const previewContainer = document.getElementById('upload-preview-container');
  const originalContent = previewContainer.innerHTML;

  // Dynamically import the background removal library
  let removeBgFn = null;
  import('https://esm.run/@imgly/background-removal').then(mod => {
    removeBgFn = mod.removeBackground;
  }).catch(err => {
    console.warn('Background removal library failed to load:', err);
  });

  // uploadedImgDataUrl holds a transparent-BG PNG data URL after removal
  let uploadedImgDataUrl = null;
  let bgRemovalDone = false;

  // File Upload listener — auto-removes background on select
  photoInput.addEventListener('change', async function(e) {
    const file = e.target.files[0];
    if (!file) {
      uploadedImgDataUrl = null;
      bgRemovalDone = false;
      previewContainer.innerHTML = originalContent;
      return;
    }

    const fileSize = (file.size / 1024).toFixed(1) + ' KB';
    uploadedImgDataUrl = null;
    bgRemovalDone = false;

    // Show processing state
    previewContainer.innerHTML = `
      <div class="flex flex-col items-center gap-4 w-full">
        <div class="relative w-32 h-32 rounded-full overflow-hidden border-2 border-primary neo-shadow flex items-center justify-center bg-surface-container">
          <span class="material-symbols-outlined text-5xl text-primary animate-spin" style="animation: spin 1.5s linear infinite;">autorenew</span>
        </div>
        <div class="flex flex-col items-center gap-1">
          <span class="text-primary font-bold uppercase tracking-widest text-label-md">Removing background...</span>
          <p class="text-on-surface-variant text-label-sm">${file.name} (${fileSize})</p>
          <p class="text-on-surface-variant text-label-sm">This may take 5–15 seconds</p>
        </div>
      </div>
    `;

    try {
      const bgRemoval = removeBgFn;
      if (!bgRemoval) throw new Error('Background removal library not loaded');

      const resultBlob = await bgRemoval(file, {
        publicPath: 'https://esm.run/@imgly/background-removal/',
        model: 'small',
        output: { format: 'image/png', quality: 1 }
      });

      // Convert blob to data URL
      const reader = new FileReader();
      reader.onload = function(ev) {
        uploadedImgDataUrl = ev.target.result;
        bgRemovalDone = true;

        // Show preview with checkered bg to show transparency
        previewContainer.innerHTML = `
          <div class="flex flex-col items-center gap-4 w-full">
            <div class="relative w-32 h-32 rounded-full overflow-hidden border-2 border-primary neo-shadow"
              style="background-image: linear-gradient(45deg, #ccc 25%, transparent 25%), linear-gradient(-45deg, #ccc 25%, transparent 25%), linear-gradient(45deg, transparent 75%, #ccc 75%), linear-gradient(-45deg, transparent 75%, #ccc 75%); background-size: 12px 12px; background-position: 0 0, 0 6px, 6px -6px, -6px 0px; background-color: white;">
              <img src="${uploadedImgDataUrl}" class="w-full h-full object-cover" />
            </div>
            <div class="flex flex-col items-center gap-1">
              <span class="text-primary font-bold uppercase tracking-widest text-label-md">✓ Background Removed!</span>
              <p class="text-on-surface-variant text-label-sm">${file.name} (${fileSize})</p>
            </div>
            <button type="button" onclick="location.reload()" class="text-primary text-label-sm uppercase underline">Change Photo</button>
          </div>
        `;
      };
      reader.readAsDataURL(resultBlob);
    } catch (err) {
      console.error('Background removal failed:', err);
      // Fallback: use original photo without bg removal
      const fallbackReader = new FileReader();
      fallbackReader.onload = function(ev) {
        uploadedImgDataUrl = ev.target.result;
        bgRemovalDone = true;
        previewContainer.innerHTML = `
          <div class="flex flex-col items-center gap-4 w-full">
            <div class="relative w-32 h-32 rounded-full overflow-hidden border-2 border-secondary neo-shadow">
              <img src="${uploadedImgDataUrl}" class="w-full h-full object-cover" />
            </div>
            <div class="flex flex-col items-center gap-1">
              <span class="text-secondary font-bold uppercase tracking-widest text-label-md">Uploaded (no BG removal)</span>
              <p class="text-on-surface-variant text-label-sm">${file.name} (${fileSize})</p>
            </div>
            <button type="button" onclick="location.reload()" class="text-primary text-label-sm uppercase underline">Change Photo</button>
          </div>
        `;
      };
      fallbackReader.readAsDataURL(file);
    }
  });

  function showNotification(message) {
    const existing = document.getElementById('validation-alert');
    if (existing) existing.remove();

    const alert = document.createElement('div');
    alert.id = 'validation-alert';
    alert.className = 'fixed top-24 left-1/2 -translate-x-1/2 z-[100] px-6 py-4 bg-secondary text-on-secondary border-2 border-surface-container-lowest neo-shadow-lg font-bold uppercase tracking-wider flex items-center gap-4 animate-bounce';
    alert.innerHTML = `
      <span class="material-symbols-outlined">warning</span>
      <span>${message}</span>
      <button onclick="this.parentElement.remove()" class="ml-4 hover:scale-110 transition-transform">
        <span class="material-symbols-outlined">close</span>
      </button>
    `;
    document.body.appendChild(alert);
    setTimeout(() => alert.remove(), 5000);
  }

  btn.addEventListener('click', () => {
    const missing = [];
    if (!nameInput.value.trim()) missing.push('NAME');
    if (!roleInput.value.trim()) missing.push('ROLE');
    if (!uploadedImgDataUrl && !bgRemovalDone) missing.push('PHOTO');

    if (missing.length > 0) {
      showNotification(`Fill ${missing.join('/')} field`);
      return;
    }

    if (!bgRemovalDone) {
      showNotification('Please wait — background removal is still processing');
      return;
    }

    // Show loading state
    btn.textContent = 'GENERATING...';
    btn.disabled = true;
    // Ensure fonts are loaded before canvas rendering
    document.fonts.ready.then(() => {
      generateBadgeAndRedirect();
    });
  });

  function generateBadgeAndRedirect() {
    const W = 800, H = 1000;
    const canvas = document.createElement('canvas');
    canvas.width = W;
    canvas.height = H;
    const ctx = canvas.getContext('2d');

    // ── HELPER ──────────────────────────────────────────────────────────────
    function fillRoundedRect(x, y, w, h, r) {
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.lineTo(x + w - r, y);
      ctx.quadraticCurveTo(x + w, y, x + w, y + r);
      ctx.lineTo(x + w, y + h - r);
      ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
      ctx.lineTo(x + r, y + h);
      ctx.quadraticCurveTo(x, y + h, x, y + h - r);
      ctx.lineTo(x, y + r);
      ctx.quadraticCurveTo(x, y, x + r, y);
      ctx.closePath();
    }

    // ── 1. BACKGROUND (paper-white) ─────────────────────────────────────────
    ctx.fillStyle = '#faf8ff';
    ctx.fillRect(0, 0, W, H);

    // ── 2. SUBTLE GRID PATTERN ──────────────────────────────────────────────
    ctx.strokeStyle = 'rgba(19, 27, 46, 0.04)';
    ctx.lineWidth = 1;
    for (let x = 0; x < W; x += 40) { ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,H); ctx.stroke(); }
    for (let y = 0; y < H; y += 40) { ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(W,y); ctx.stroke(); }

    // ── 3. TOP ACCENT STRIP (Primary Green thin line) ───────────────────────
    ctx.fillStyle = '#22c55e';
    ctx.fillRect(0, 0, W, 6);

    // ── 4. SMALL HEADER BAR (Secondary Pink) ────────────────────────────────
    const headerH = 52;
    ctx.fillStyle = '#b4136d';
    ctx.fillRect(0, 6, W, headerH);
    ctx.strokeStyle = '#0F172A';
    ctx.lineWidth = 3;
    ctx.strokeRect(0, 6, W, headerH);

    // Dot pattern decoration in header
    ctx.fillStyle = 'rgba(255,255,255,0.15)';
    for (let dx = 20; dx < W; dx += 24) {
      for (let dy = 12; dy < 6 + headerH; dy += 14) {
        ctx.beginPath(); ctx.arc(dx, dy, 2, 0, Math.PI * 2); ctx.fill();
      }
    }

    // Header label (small, label-md style)
    ctx.fillStyle = '#ffffff';
    ctx.textAlign = 'center';
    ctx.font = '700 14px "JetBrains Mono", monospace';
    ctx.fillText('HACKER HOUSE GOA 2026', W / 2, 37);

    // ── 5. MAIN CARD AREA ──────────────────────────────────────────────────
    const cardX = 40, cardY = 80, cardW = W - 80, cardH = H - 200;
    // Card hard shadow
    ctx.fillStyle = '#0F172A';
    fillRoundedRect(cardX + 6, cardY + 6, cardW, cardH, 8);
    ctx.fill();
    // Card surface
    ctx.fillStyle = '#ffffff';
    fillRoundedRect(cardX, cardY, cardW, cardH, 8);
    ctx.fill();
    ctx.strokeStyle = '#0F172A';
    ctx.lineWidth = 3;
    fillRoundedRect(cardX, cardY, cardW, cardH, 8);
    ctx.stroke();

    // ── 6. DECORATIVE YELLOW STICKER (top-right, rotated) ──────────────────
    ctx.save();
    ctx.translate(W - 60, 115);
    ctx.rotate(8 * Math.PI / 180);
    ctx.fillStyle = '#0F172A'; // shadow
    fillRoundedRect(-52, -17, 108, 34, 4);
    ctx.fill();
    ctx.fillStyle = '#d7a400'; // tertiary container yellow
    ctx.strokeStyle = '#0F172A';
    ctx.lineWidth = 3;
    fillRoundedRect(-56, -21, 108, 34, 4);
    ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#0F172A';
    ctx.font = '700 13px "JetBrains Mono", monospace';
    ctx.textAlign = 'center';
    ctx.fillText('GOA 2026', 0, 5);
    ctx.restore();

    // ── 7. DECORATIVE CYAN STICKER (top-left, rotated) ─────────────────────
    ctx.save();
    ctx.translate(62, 120);
    ctx.rotate(-5 * Math.PI / 180);
    ctx.fillStyle = '#0F172A'; // shadow
    fillRoundedRect(-50, -17, 104, 34, 4);
    ctx.fill();
    ctx.fillStyle = '#06B6D4'; // electric cyan
    ctx.strokeStyle = '#0F172A';
    ctx.lineWidth = 3;
    fillRoundedRect(-54, -21, 104, 34, 4);
    ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#0F172A';
    ctx.font = '700 12px "JetBrains Mono", monospace';
    ctx.textAlign = 'center';
    ctx.fillText('> BUILD_', 0, 5);
    ctx.restore();

    // ── 8. AVATAR PHOTO (background removed, full-figure cutout) ────────────
    const userImg = new Image();
    userImg.onload = function() {
      const cx = W / 2, cy = 380, r = 155;

      // Decorative backing circle — outer shadow
      ctx.save();
      ctx.beginPath();
      ctx.arc(cx + 7, cy + 7, r + 10, 0, Math.PI * 2);
      ctx.fillStyle = '#0F172A';
      ctx.fill();
      ctx.restore();

      // Decorative backing circle — primary green ring
      ctx.save();
      ctx.beginPath();
      ctx.arc(cx, cy, r + 10, 0, Math.PI * 2);
      ctx.fillStyle = '#22c55e';
      ctx.fill();
      ctx.strokeStyle = '#0F172A';
      ctx.lineWidth = 3;
      ctx.stroke();
      ctx.restore();

      // Inner backing fill (light surface)
      ctx.save();
      ctx.beginPath();
      ctx.arc(cx, cy, r + 3, 0, Math.PI * 2);
      ctx.fillStyle = '#f2f3ff';
      ctx.fill();
      ctx.restore();

      // Draw BG-removed photo as a centered cutout (transparent PNG)
      // Scale to fill the circle area while maintaining aspect ratio
      const imgAspect = userImg.width / userImg.height;
      let dw, dh;
      if (imgAspect >= 1) {
        // wider image: match diameter width
        dw = (r + 3) * 2;
        dh = dw / imgAspect;
      } else {
        // taller image: match diameter height
        dh = (r + 3) * 2;
        dw = dh * imgAspect;
      }
      const dx = cx - dw / 2;
      const dy = cy - dh / 2;
      ctx.drawImage(userImg, dx, dy, dw, dh);

      // ── 9. NAME (Bricolage Grotesque, headline-lg style) ──────────────────
      const nameVal = nameInput.value.trim().toUpperCase();
      // Measure & truncate if too wide
      ctx.font = '800 54px "Bricolage Grotesque", sans-serif';
      let fontSize = 54;
      while (ctx.measureText(nameVal).width > cardW - 80 && fontSize > 28) {
        fontSize -= 2;
        ctx.font = `800 ${fontSize}px "Bricolage Grotesque", sans-serif`;
      }
      ctx.fillStyle = '#131b2e'; // on-background
      ctx.textAlign = 'center';
      ctx.fillText(nameVal, W / 2, 645);

      // Divider line under name
      ctx.strokeStyle = '#bccbb9'; // outline-variant
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(cardX + 60, 665);
      ctx.lineTo(cardX + cardW - 60, 665);
      ctx.stroke();

      // ── 10. ROLE STICKER ─────────────────────────────────────────────────
      const roleVal = roleInput.value.trim().toUpperCase();
      ctx.font = '700 22px "JetBrains Mono", monospace';
      const tw = ctx.measureText('> ' + roleVal).width;
      const pX = 32, pY = 14;
      const sW = tw + pX * 2, sH = 22 + pY * 2;
      const sX = (W - sW) / 2, sY = 690;

      // Sticker shadow
      ctx.fillStyle = '#0F172A';
      ctx.fillRect(sX + 5, sY + 5, sW, sH);

      // Sticker fill — primary green
      ctx.fillStyle = '#006e2f';
      ctx.strokeStyle = '#0F172A';
      ctx.lineWidth = 3;
      ctx.fillRect(sX, sY, sW, sH);
      ctx.strokeRect(sX, sY, sW, sH);

      // Sticker text
      ctx.fillStyle = '#6bff8f'; // primary-fixed bright green
      ctx.textAlign = 'center';
      ctx.fillText('> ' + roleVal, W / 2, sY + pY + 17);

      // ── 11. BOTTOM ACCENT ROW ─────────────────────────────────────────────
      ctx.fillStyle = '#fd56a7'; // secondary-container pink accent strip
      ctx.fillRect(cardX, cardY + cardH - 36, cardW, 36);
      ctx.strokeStyle = '#0F172A';
      ctx.lineWidth = 3;
      ctx.strokeRect(cardX, cardY + cardH - 36, cardW, 36);

      ctx.fillStyle = '#ffffff';
      ctx.font = '700 12px "JetBrains Mono", monospace';
      ctx.textAlign = 'center';
      ctx.fillText('OCTOBER 2026 • GOA, INDIA', W / 2, cardY + cardH - 14);

      // ── 12. FOOTER BAR (Jungle Dark) ──────────────────────────────────────
      ctx.fillStyle = '#064E3B';
      ctx.fillRect(0, H - 120, W, 120);
      ctx.strokeStyle = '#0F172A';
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.moveTo(0, H - 120);
      ctx.lineTo(W, H - 120);
      ctx.stroke();

      // Footer logo text
      ctx.fillStyle = '#22c55e'; // primary-container
      ctx.font = '800 22px "Bricolage Grotesque", sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('HACKER HOUSE', W / 2, H - 80);

      ctx.fillStyle = '#ffffff';
      ctx.font = '700 13px "JetBrains Mono", monospace';
      ctx.fillText('STITCH GOA • BUILD THE FUTURE', W / 2, H - 52);

      // Footer bottom accent
      ctx.fillStyle = '#b4136d';
      ctx.fillRect(0, H - 8, W, 8);

      // ── 13. SAVE & REDIRECT ───────────────────────────────────────────────
      try {
        sessionStorage.setItem('generatedBadge', canvas.toDataURL('image/png'));
        sessionStorage.setItem('generatedBadgeName', nameInput.value.trim());
        window.location.href = 'success.html';
      } catch (e) {
        console.error('Failed to save to sessionStorage', e);
        btn.textContent = 'GENERATE';
        btn.disabled = false;
        alert('Failed to save badge. The photo may be too large — try a smaller image.');
      }
    };
    userImg.src = uploadedImgDataUrl;
  }
})();
</script></body></html>
