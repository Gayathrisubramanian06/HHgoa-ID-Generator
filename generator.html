<script>
(function() {
  const btn = document.getElementById('generate-btn');
  const nameInput = document.getElementById('name');
  const roleInput = document.getElementById('role');
  const photoInput = document.getElementById('photo-upload');

  function showNotification(message) {
    const existing = document.getElementById('validation-alert');
    if (existing) existing.remove();

    const alert = document.createElement('div');
    alert.id = 'validation-alert';
    alert.className = 'fixed top-24 left-1/2 -translate-x-1/2 z-[100] px-6 py-4 bg-secondary text-on-secondary border-2 border-surface-container-lowest neo-shadow-lg font-bold uppercase tracking-wider flex items-center gap-4 animate-bounce';
    alert.innerHTML = `
      <span class="material-symbols-outlined">warning</span>
      <span>${message}</span>
      <button onclick="this.parentElement.remove()" class="ml-4 hover:scale-110 transition-transform">
        <span class="material-symbols-outlined">close</span>
      </button>
    `;
    document.body.appendChild(alert);
    setTimeout(() => alert.remove(), 5000);
  }

  btn.addEventListener('click', () => {
    const missing = [];
    if (!nameInput.value.trim()) missing.push('NAME');
    if (!roleInput.value.trim()) missing.push('ROLE');
    if (!photoInput.files || photoInput.files.length === 0) missing.push('PHOTO');

    if (missing.length > 0) {
      showNotification(`Fill ${missing.join('/')} field`);
    } else {
      // Logic for successful generation would go here
      console.log('Generating frame...');
    }
  });
})();
</script>

<script class="">
(function() {
  const photoInput = document.getElementById('photo-upload');
  const previewContainer = document.getElementById('upload-preview-container');
  const originalContent = previewContainer.innerHTML;

  photoInput.addEventListener('change', function(e) {
    const file = e.target.files[0];
    if (file) {
      const reader = new FileReader();
      reader.onload = function(event) {
        previewContainer.innerHTML = `
          <div class="relative w-full h-32 flex items-center justify-center overflow-hidden rounded-DEFAULT">
            <img src="${event.target.result}" class="w-full h-full object-cover opacity-80" />
            <div class="absolute inset-0 flex items-center justify-center bg-surface-container/40 backdrop-blur-sm">
              <span class="material-symbols-outlined text-white text-4xl">check_circle</span>
            </div>
          </div>
          <p class="text-center text-label-sm uppercase tracking-wider">${file.name}</p>
        `;
      };
      reader.readAsDataURL(file);
    } else {
      previewContainer.innerHTML = originalContent;
    }
  });
})();
</script>

<script>
(function() {
  const photoInput = document.getElementById('photo-upload');
  const previewContainer = document.getElementById('upload-preview-container');
  const originalContent = previewContainer.innerHTML;

  photoInput.addEventListener('change', function(e) {
    const file = e.target.files[0];
    if (file) {
      const reader = new FileReader();
      const fileSize = (file.size / 1024).toFixed(1) + ' KB';
      
      reader.onload = function(event) {
        previewContainer.innerHTML = `
          <div class="flex flex-col items-center gap-4 w-full">
            <div class="relative w-32 h-32 rounded-full overflow-hidden border-2 border-secondary neo-shadow">
              <img src="${event.target.result}" class="w-full h-full object-cover" />
            </div>
            <div class="flex flex-col items-center gap-1">
              <span class="text-secondary font-bold uppercase tracking-widest text-label-md">Uploaded Successfully!</span>
              <p class="text-on-surface-variant text-label-sm">${file.name} (${fileSize})</p>
            </div>
            <button type="button" onclick="location.reload()" class="text-primary text-label-sm uppercase underline">Change Photo</button>
          </div>
        `;
      };
      reader.readAsDataURL(file);
    } else {
      previewContainer.innerHTML = originalContent;
    }
  });
})();
