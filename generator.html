  <style>

        <body
          class="bg-paper-white text-ink font-mono overflow-x-hidden min-h-screen relative selection:bg-primary-container selection:text-ink">

          <!-- Background Pattern -->
          <div class="fixed inset-0 z-0 pointer-events-none"

          <!-- Decorative Ribbon -->

            <div
              class="diagonal-sash py-3 border-y-[3px] border-ink font-display text-2xl uppercase tracking-widest neo-shadow-sm flex justify-center items-center">
              <div class="marquee-container w-full">
                <div class="marquee-content">
                  <span>HACKER HOUSE GOA 2026 ★ BUILD THE FUTURE ★ JUNGLE PULSE ★ </span>
                  <span>HACKER HOUSE GOA 2026 ★ BUILD THE FUTURE ★ JUNGLE PULSE ★ </span>
                </div>
              </div>
            </div>
          </div>

          <!-- TopAppBar -->
          <header
            class="bg-surface border-b-[3px] border-ink neo-shadow-sm flex justify-between items-center px-4 h-20 w-full z-50 sticky top-0">
            <div class="flex items-center gap-4">
              <a href="index.html" class="flex items-center gap-3 btn-press">
                <div class="relative flex items-center h-12 bg-primary px-4 py-2 border-[3px] border-ink rounded">
                  <span

                  <div

              <span class="material-symbols-outlined text-ink font-bold">bolt</span>

          <!-- Main Content -->
          <main
            class="relative z-10 container mx-auto px-4 md:px-8 max-w-5xl flex flex-col md:flex-row gap-8 lg:gap-16 pb-32 md:pb-16 pt-32">

            <div
              class="w-full max-w-2xl mx-auto flex flex-col gap-8 bg-surface border-[3px] border-ink rounded-lg neo-shadow-lg p-6 md:p-10 fade-in">

                </div>
                <h1 class="font-display text-4xl md:text-5xl text-ink uppercase tracking-tight font-extrabold">Generate
                  ID</h1>

                  ENTER_CREDENTIALS</p>
              </div>

              <form class="flex flex-col gap-6">
                <div class="flex flex-col gap-2">
                  <label class="font-mono text-ink font-bold uppercase tracking-wider text-sm">>_ NAME</label>
                  <input
                    class="bg-surface-container-lowest border-[3px] border-ink p-4 rounded text-ink font-mono focus:outline-none focus:ring-0 focus:border-primary neo-shadow-sm transition-colors"
                    id="name" placeholder="YOUR NAME" type="text">

                  <label class="font-mono text-ink font-bold uppercase tracking-wider text-sm">>_ ROLE</label>
                  <input
                    class="bg-surface-container-lowest border-[3px] border-ink p-4 rounded text-ink font-mono focus:outline-none focus:ring-0 focus:border-primary neo-shadow-sm transition-colors"
                    id="role" placeholder="e.g. FULLSTACK ENGINEER" type="text">
                </div>

                <div class="flex flex-col gap-2 mt-4">
                  <label class="font-mono text-ink font-bold uppercase tracking-wider text-sm">>_ UPLOAD_PHOTO</label>
                  <div class="relative group cursor-pointer">
                    <input type="file" id="photo-upload"
                      class="absolute inset-0 w-full h-full opacity-0 z-10 cursor-pointer"
                      accept="image/jpeg, image/png, image/heic">
                    <div
                      class="bg-surface-container-low border-[3px] border-dashed border-ink p-8 rounded text-ink font-mono flex flex-col items-center justify-center gap-3 transition-colors group-hover:bg-surface-container"
                      id="upload-preview-container">
                      <div
                        class="w-16 h-16 bg-primary-container border-[3px] border-ink rounded-full flex items-center justify-center neo-shadow-sm mb-2">
                        <span class="material-symbols-outlined text-3xl text-ink">add_photo_alternate</span>
                      </div>
                      <p class="text-center font-bold uppercase">Click to Browse</p>
                      <p class="text-center text-xs opacity-70">JPG, PNG, HEIC</p>
                    </div>
                  </div>
                </div>

                <button type="button"
                  class="mt-6 w-full bg-primary-container text-ink border-[3px] border-ink py-5 font-display font-bold text-xl uppercase tracking-widest btn-press neo-shadow flex justify-center items-center gap-2 rounded"
                  id="generate-btn">
                  [ GENERATE_BADGE ]
                </button>
              </form>

            </div>
          </main>

          <script type="module">
          (function () {
            const btn = document.getElementById('generate-btn');
            const nameInput = document.getElementById('name');
            const roleInput = document.getElementById('role');
            const photoInput = document.getElementById('photo-upload');
            const previewContainer = document.getElementById('upload-preview-container');
            const originalContent = previewContainer.innerHTML;

            const REMOVE_BG_API_KEY = "2WmGDqurYTJo64YoEfVPEW6D";


            let uploadedImgDataUrl = null;
            let bgRemovalDone = false;

            photoInput.addEventListener('change', async function (e) {
              const file = e.target.files[0];
              if (!file) {
                uploadedImgDataUrl = null;
                bgRemovalDone = false;
                previewContainer.innerHTML = originalContent;
                return;
              }

              const fileSize = (file.size / 1024).toFixed(1) + ' KB';
              uploadedImgDataUrl = null;
              bgRemovalDone = false;

              previewContainer.innerHTML = `
      <div class="flex flex-col items-center gap-4 w-full">
        <div class="w-24 h-24 rounded-full border-[3px] border-ink neo-shadow-sm flex items-center justify-center bg-tertiary-container relative overflow-hidden">
          <span class="material-symbols-outlined text-4xl text-ink animate-[spin_2s_linear_infinite]">sync</span>
        </div>
        <div class="flex flex-col items-center gap-1 text-center">
          <span class="text-ink font-bold uppercase tracking-wider text-sm">> REMOVING_BACKGROUND_API...</span>
          <p class="text-on-surface-variant text-xs font-mono">${file.name} (${fileSize})</p>
        </div>
      </div>
    `;

              try {
                if (REMOVE_BG_API_KEY === "YOUR_API_KEY_HERE") {
                  throw new Error("Please add your remove.bg API key to the script.");
                }

                const formData = new FormData();
                formData.append('image_file', file);
                formData.append('size', 'auto');

                const response = await fetch('https://api.remove.bg/v1.0/removebg', {
                  method: 'POST',
                  headers: {
                    'X-Api-Key': REMOVE_BG_API_KEY
                  },
                  body: formData
                });

                if (!response.ok) {
                  throw new Error(`remove.bg API Error: ${response.status} ${response.statusText}`);
                }

                const resultBlob = await response.blob();
                const reader = new FileReader();
                reader.onload = function (ev) {
                  uploadedImgDataUrl = ev.target.result;
                  bgRemovalDone = true;

                  previewContainer.innerHTML = `
          <div class="flex flex-col items-center gap-4 w-full">
            <div class="w-32 h-32 rounded-full border-[3px] border-ink neo-shadow-sm bg-surface-container relative overflow-hidden" style="background-image: radial-gradient(#d2d9f4 2px, transparent 2px); background-size: 10px 10px;">
              <img src="${uploadedImgDataUrl}" class="w-full h-full object-cover" />
            </div>
            <div class="flex flex-col items-center gap-1 text-center">
              <span class="text-primary font-bold uppercase tracking-wider text-sm">> SUBJECT_ACQUIRED</span>
              <p class="text-on-surface-variant text-xs font-mono">${file.name}</p>
            </div>
            <button type="button" onclick="location.reload()" class="text-secondary text-xs uppercase font-bold hover:underline">> RESET</button>
          </div>
        `;
                };
                reader.readAsDataURL(resultBlob);
              } catch (err) {
                console.error('Background removal failed:', err);
                const fallbackReader = new FileReader();
                fallbackReader.onload = function (ev) {
                  uploadedImgDataUrl = ev.target.result;
                  bgRemovalDone = true;
                  previewContainer.innerHTML = `
          <div class="flex flex-col items-center gap-4 w-full">
            <div class="w-32 h-32 rounded-full border-[3px] border-ink neo-shadow-sm overflow-hidden">
              <img src="${uploadedImgDataUrl}" class="w-full h-full object-cover" />
            </div>
            <div class="flex flex-col items-center gap-1 text-center">
              <span class="text-secondary font-bold uppercase tracking-wider text-sm">> RAW_IMAGE_LOADED (API_FAILED)</span>
              <p class="text-on-surface-variant text-xs font-mono">${err.message}</p>
            </div>
            <button type="button" onclick="location.reload()" class="text-primary text-xs uppercase font-bold hover:underline">> RESET</button>
          </div>
        `;
                };
                fallbackReader.readAsDataURL(file);
              }
            });

            function showNotification(message) {
              const existing = document.getElementById('validation-alert');
              if (existing) existing.remove();

              const alert = document.createElement('div');
              alert.id = 'validation-alert';
              alert.className = 'fixed top-4 left-1/2 -translate-x-1/2 z-[100] px-6 py-4 bg-tertiary-container text-ink border-[3px] border-ink neo-shadow font-bold uppercase tracking-wider flex items-center gap-4 fade-in rounded';
              alert.innerHTML = `
      <span class="material-symbols-outlined">error</span>
      <span class="font-mono text-sm">> ${message}</span>
      <button onclick="this.parentElement.remove()" class="ml-4 hover:scale-110 transition-transform">
        <span class="material-symbols-outlined">close</span>
      </button>
    `;
              document.body.appendChild(alert);
              setTimeout(() => alert.remove(), 4000);
            }

            btn.addEventListener('click', () => {
              const missing = [];
              if (!nameInput.value.trim()) missing.push('NAME');
              if (!roleInput.value.trim()) missing.push('ROLE');
              if (!uploadedImgDataUrl && !bgRemovalDone) missing.push('PHOTO');

              if (missing.length > 0) {
                showNotification(\`ERR: MISSING [ \${missing.join(', ')} ]\`);
      return;
    }

    if (!bgRemovalDone) {
      showNotification('PROCESSING_IMAGE... PLEASE_WAIT');
      return;
    }

    btn.textContent = '[ GENERATING... ]';
    btn.disabled = true;
    document.fonts.ready.then(() => {
      generateBadgeAndRedirect();
    });
  });

  function generateBadgeAndRedirect() {
    const W = 800, H = 1000;
    const canvas = document.createElement('canvas');
    canvas.width = W; canvas.height = H;
    const ctx = canvas.getContext('2d');
    const ink = '#0F172A';

    function fillRoundedRect(x, y, w, h, r) {
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.lineTo(x + w - r, y);
      ctx.quadraticCurveTo(x + w, y, x + w, y + r);
      ctx.lineTo(x + w, y + h - r);
      ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
      ctx.lineTo(x + r, y + h);
      ctx.quadraticCurveTo(x, y + h, x, y + h - r);
      ctx.lineTo(x, y + r);
      ctx.quadraticCurveTo(x, y, x + r, y);
      ctx.closePath();
    }

    // 1. PAPER BACKGROUND
    ctx.fillStyle = '#faf8ff';
    ctx.fillRect(0, 0, W, H);

    // 2. NEO-BRUTALIST GRID
    ctx.strokeStyle = '#d2d9f4';
    ctx.lineWidth = 1;
    for (let x = 0; x < W; x += 40) { ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,H); ctx.stroke(); }
    for (let y = 0; y < H; y += 40) { ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(W,y); ctx.stroke(); }

    // 3. TOP BORDER
    ctx.fillStyle = ink;
    ctx.fillRect(0, 0, W, 12);

    // 4. MAIN CARD
    const cX = 60, cY = 80, cW = W - 120, cH = H - 240;
    
    // Card Shadow
    ctx.fillStyle = ink;
    fillRoundedRect(cX + 12, cY + 12, cW, cH, 8);
    ctx.fill();
    
    // Card Body
    ctx.fillStyle = '#ffffff';
    fillRoundedRect(cX, cY, cW, cH, 8);
    ctx.fill();
    ctx.strokeStyle = ink;
    ctx.lineWidth = 4;
    ctx.stroke();

    // 5. STICKER: HEADER (Secondary Pink)
    ctx.save();
    ctx.translate(cX - 10, cY + 40);
    ctx.rotate(-3 * Math.PI / 180);
    ctx.fillStyle = ink; fillRoundedRect(6, 6, 220, 48, 4); ctx.fill();
    ctx.fillStyle = '#b4136d'; fillRoundedRect(0, 0, 220, 48, 4); ctx.fill();
    ctx.strokeRect(0, 0, 220, 48);
    ctx.fillStyle = '#ffffff';
    ctx.font = '800 20px "Bricolage Grotesque"';
    ctx.fillText('JUNGLE PULSE', 20, 32);
    ctx.restore();

    // 6. PHOTO LAYER
    const userImg = new Image();
    userImg.onload = function() {
      const cx = W / 2, cy = 340, r = 160;

      // Circle Shadow
      ctx.fillStyle = ink;
      ctx.beginPath(); ctx.arc(cx + 8, cy + 8, r + 4, 0, Math.PI*2); ctx.fill();

      // Circle Border & BG
      ctx.fillStyle = '#f2f3ff';
      ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI*2); ctx.fill();
      ctx.strokeStyle = ink; ctx.lineWidth = 4; ctx.stroke();

      // Circle Inner Ring (Primary Green)
      ctx.strokeStyle = '#22c55e';
      ctx.lineWidth = 8;
      ctx.beginPath(); ctx.arc(cx, cy, r - 6, 0, Math.PI*2); ctx.stroke();

      // Clip and draw image
      ctx.save();
      ctx.beginPath(); ctx.arc(cx, cy, r - 10, 0, Math.PI*2); ctx.clip();
      
      const imgAspect = userImg.width / userImg.height;
      let dw, dh;
      if (imgAspect >= 1) {
        dw = r * 2.2; dh = dw / imgAspect;
      } else {
        dh = r * 2.2; dw = dh * imgAspect;
      }
      ctx.drawImage(userImg, cx - dw/2, cy - dh/2 + 20, dw, dh);
      ctx.restore();

      // 7. NAME
      const nameVal = nameInput.value.trim().toUpperCase();
      ctx.font = '800 64px "Bricolage Grotesque"';
      let fontSize = 64;
      while (ctx.measureText(nameVal).width > cW - 80 && fontSize > 30) {
        fontSize -= 2;
        ctx.font = \`800 \${fontSize}px "Bricolage Grotesque"\`;
      }
      ctx.fillStyle = ink;
      ctx.textAlign = 'center';
      ctx.fillText(nameVal, W / 2, 600);

      // 8. STICKER: ROLE (Primary Green)
      const roleVal = "> " + roleInput.value.trim().toUpperCase();
      ctx.font = '700 24px "JetBrains Mono"';
      const tw = ctx.measureText(roleVal).width;
      const sW = tw + 40, sH = 50;
      
      ctx.save();
      ctx.translate(W/2 - sW/2, 630);
      ctx.rotate(1 * Math.PI / 180);
      ctx.fillStyle = ink; fillRoundedRect(6, 6, sW, sH, 4); ctx.fill();
      ctx.fillStyle = '#22c55e'; fillRoundedRect(0, 0, sW, sH, 4); ctx.fill();
      ctx.lineWidth = 3; ctx.strokeRect(0, 0, sW, sH);
      ctx.fillStyle = ink;
      ctx.textAlign = 'left';
      ctx.fillText(roleVal, 20, 34);
      ctx.restore();

      // 9. BOTTOM ACCENT STRIP (Tertiary Yellow)
      ctx.fillStyle = '#d7a400';
      ctx.fillRect(cX, cY + cH - 48, cW, 48);
      ctx.lineWidth = 4;
      ctx.beginPath(); ctx.moveTo(cX, cY + cH - 48); ctx.lineTo(cX + cW, cY + cH - 48); ctx.stroke();
      
      ctx.fillStyle = ink;
      ctx.font = '700 16px "JetBrains Mono"';
      ctx.textAlign = 'center';
      ctx.fillText('GOA 2026 // BUILD THE FUTURE', W/2, cY + cH - 18);

      // 10. FOOTER
      ctx.fillStyle = ink;
      ctx.fillRect(0, H - 100, W, 100);
      
      ctx.fillStyle = '#ffffff';
      ctx.font = '800 32px "Bricolage Grotesque"';
      ctx.textAlign = 'center';
      ctx.fillText('STITCH GOA', W/2, H - 45);

      ctx.fillStyle = '#fd56a7';
      ctx.fillRect(0, H - 12, W, 12);

      // SAVE
      try {
        sessionStorage.setItem('generatedBadge', canvas.toDataURL('image/png'));
        sessionStorage.setItem('generatedBadgeName', nameInput.value.trim());
        window.location.href = 'success.html';
      } catch (e) {
        console.error(e);
        btn.textContent = '[ GENERATE_BADGE ]';
        btn.disabled = false;
        alert('ERR: IMAGE_TOO_LARGE');
      }
    };
    userImg.src = uploadedImgDataUrl;
  }
})();
          </script>
