    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const badgeImage = document.getElementById('badge-image');
            const saveBtn = document.getElementById('save-btn');
            const shareBtn = document.getElementById('share-btn');

            // Retrieve generated badge from sessionStorage
            const generatedData = sessionStorage.getItem('generatedBadge');
            const userName = sessionStorage.getItem('generatedBadgeName') || 'Hacker';

            if (generatedData) {
                badgeImage.src = generatedData;
            } else {
                // Fallback placeholder if no data is found
                badgeImage.src = "https://lh3.googleusercontent.com/aida-public/AB6AXuALhRO8n9arS7DyszKDBbivtOrjsJwgoh1NYkhoT7aV_JeYHh8kSKjWPKX157GpRQj4JJ4OCnl_tl1sjbt3-lwTWXoHfqupbU0ryx4qI3Mugga58o6goRO7lqFFiv8oFuOdciJwTf6ztfJ9zOsjLCBgMXuX1JhtK5lqeGwhF3vLVVLWEwSK5XF1SOspnZarssnbvrA0qhWfe1KiZ2TPXFcot1Uf2REkrwA-gF_92BAgnHZGCWxyKxLQfmPnWfR0AXCM904";
            }

            // Download/Save button handler
            saveBtn.addEventListener('click', () => {
                const dataUrl = badgeImage.src;
                if (!dataUrl.startsWith('data:')) return;
                const link = document.createElement('a');
                link.download = `Hacker_House_Goa_Badge_${userName.replace(/\s+/g, '_')}.png`;
                link.href = dataUrl;
                link.click();
            });

            // Share on X handler
            shareBtn.addEventListener('click', () => {
                const text = encodeURIComponent(`Just generated my profile badge for Hacker House Goa 2026! 🌴🚀 Join me there! #HackerHouseGoa`);
                const url = `https://twitter.com/intent/tweet?text=${text}`;
                window.open(url, '_blank');
            });
