<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>
        Your Hacker House ID
    </title>


    <script src="https://cdn.tailwindcss.com"></script>


    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Bricolage+Grotesque:opsz,wght@12..96,400;600;700;800&display=swap"
        rel="stylesheet">


    <link rel="stylesheet" href="styles.css">

</head>


<body class="success-page">


    <!-- =====================================================
         NAVIGATION
    ====================================================== -->

    <nav class="site-nav">

        <div class="nav-logo">
            HACKER HOUSE
        </div>

        <div class="nav-links">

            <a href="index.html">
                HOME
            </a>

            <a href="generator.html">
                CREATE ANOTHER
            </a>

        </div>

    </nav>


    <!-- =====================================================
         SUCCESS CONTENT
    ====================================================== -->

    <main class="success-wrapper">


        <div class="success-heading">

            <p class="eyebrow">
                2:47 PM STUDIO
            </p>

            <h1>
                YOUR ID IS READY
            </h1>

            <p>
                Your personalized Hacker House Goa 2026
                ID has been generated.
            </p>

        </div>


        <!-- =================================================
             BADGE
        ================================================== -->

        <div class="success-badge-wrapper">

            <img id="badge-image" class="success-badge" alt="Generated Hacker House Goa 2026 ID">

        </div>


        <!-- =================================================
             ACTIONS
        ================================================== -->

        <div class="success-actions">

            <button id="save-btn" class="generate-button" type="button">

                SAVE TO GALLERY

            </button>


            <button id="share-btn" class="secondary-button" type="button">

                SHARE

            </button>

        </div>


        <a href="generator.html" class="create-another">

            CREATE ANOTHER ID

        </a>


    </main>


    <!-- =====================================================
         SUCCESS SCRIPT
    ====================================================== -->

    <script>

        document.addEventListener(
            'DOMContentLoaded',
            () => {

                const badgeImage =
                    document.getElementById(
                        'badge-image'
                    );


                const saveBtn =
                    document.getElementById(
                        'save-btn'
                    );


                const shareBtn =
                    document.getElementById(
                        'share-btn'
                    );


                // ---------------------------------------------
                // Get generated badge
                // ---------------------------------------------

                const generatedData =
                    sessionStorage.getItem(
                        'generatedBadge'
                    );


                const userName =
                    sessionStorage.getItem(
                        'generatedBadgeName'
                    ) || 'Hacker';


                if (generatedData) {

                    badgeImage.src =
                        generatedData;

                } else {

                    badgeImage.alt =
                        'No generated badge found';

                    alert(
                        'No generated ID found. ' +
                        'Please create your ID first.'
                    );

                }


                // ---------------------------------------------
                // SAVE
                // ---------------------------------------------

                saveBtn.addEventListener(
                    'click',
                    () => {

                        if (!generatedData) {
                            return;
                        }


                        const link =
                            document.createElement(
                                'a'
                            );


                        link.href =
                            generatedData;


                        link.download =
                            `Hacker_House_Goa_2026_${userName
                                .replace(/\s+/g, '_')
                            }.png`;


                        link.click();

                    }
                );


                // ---------------------------------------------
                // SHARE
                // ---------------------------------------------

                shareBtn.addEventListener(
                    'click',
                    async () => {

                        if (!generatedData) {
                            return;
                        }


                        try {

                            const response =
                                await fetch(
                                    generatedData
                                );


                            const blob =
                                await response.blob();


                            const file =
                                new File(
                                    [blob],
                                    'Hacker_House_Goa_2026_ID.png',
                                    {
                                        type:
                                            'image/png'
                                    }
                                );


                            if (
                                navigator.share &&
                                navigator.canShare &&
                                navigator.canShare({
                                    files: [file]
                                })
                            ) {

                                await navigator.share({
                                    title:
                                        'Hacker House Goa 2026',

                                    text:
                                        'My Hacker House Goa 2026 ID',

                                    files: [file]
                                });

                            } else {

                                alert(
                                    'Sharing is not supported ' +
                                    'on this browser.'
                                );

                            }

                        } catch (error) {

                            console.error(
                                'Share failed:',
                                error
                            );

                        }

                    }
                );

            }
        );

    </script>


</body>

</html>
